name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: PyInstaller
        run: python -m PyInstaller --noconfirm --clean packaging/FaceLES.spec

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile installer
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\windows\FaceLES.iss

      - name: Upload FaceLES-Setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: FaceLES-Setup-windows
          path: dist/FaceLES-Setup.exe

      - name: Upload portable folder
        uses: actions/upload-artifact@v4
        with:
          name: FaceLES-portable-windows
          path: dist/FaceLES
